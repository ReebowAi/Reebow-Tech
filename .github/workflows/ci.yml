# ════════════════════════════════════════════════════════════════════════
# REEBOW TECH PLATFORM — GITHUB ACTIONS AUTOMATION (CI/CD)
# Multi-stage checks: Code Check → Testing → Security → Build & Deploy
# Version: 2.0.1
# ════════════════════════════════════════════════════════════════════════

name: Reebow Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      skip_tests:
        description: 'Skip running test suite'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ════════════════════════════════════════════════════════════════════════
# JOBS DEFINITION
# ════════════════════════════════════════════════════════════════════════

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # CODE QUALITY CHECK
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Code Style & Linting Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint Check
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npx prettier --check "**/*.{js,json,md,yml,yaml,html,css}"

  # ─────────────────────────────────────────────────────────────────────
  # AUTOMATED TESTING SUITE
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Run Test Suite & Database Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    services:
      mongodb:
        image: mongo:7-jammy
        ports: ['27017:27017']
        options: --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prepare Test Clips & Manifest File
        run: |
          mkdir -p public/clips/annie public/clips/craig
          ffmpeg -f lavfi -i color=c=black:s=1280x720 -t 1 -c:v libx264 -pix_fmt yuv420p public/clips/annie/hello.mp4 -y
          ffmpeg -f lavfi -i color=c=black:s=1280x720 -t 2 -c:v libx264 -pix_fmt yuv420p public/clips/annie/listening.mp4 -y
          cp public/clips/annie/hello.mp4 public/clips/annie/thinking.mp4
          cp public/clips/annie/hello.mp4 public/clips/annie/yes.mp4
          cp public/clips/annie/hello.mp4 public/clips/annie/no.mp4
          cp public/clips/annie/hello.mp4 public/clips/annie/goodbye.mp4
          cp -r public/clips/annie/* public/clips/craig/
          node -e "
            const fs = require('fs'), path = require('path');
            const base = '/clips', personas = ['annie','craig'];
            const m = {};
            personas.forEach(p => { m[p] = {}; 
              fs.readdirSync('public'+base+'/'+p).filter(f=>f.endsWith('.mp4')).forEach(f => {
                m[p][f.replace('.mp4','')] = { url: path.join(base,p,f) };
              }); 
            });
            fs.writeFileSync('public/clips/manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Run Unit Tests
        run: npm test --if-present
        env:
          MONGO_URI: mongodb://localhost:27017/reebow-test
          NODE_ENV: test
          DEV_MOCK_GEO: 'true'
          DEV_DISABLE_RATE_LIMIT: 'true'
          SESSION_SECRET: test-secret-for-ci-only-do-not-use-in-production

      - name: Upload Test Coverage Reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: unittests
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────
  # SECURITY & DEPENDENCY AUDIT
  # ─────────────────────────────────────────────────────────────────────
  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Package Vulnerability Audit
        run: npm audit --audit-level=high --json > audit-report.json || true

      - name: Upload Security Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 7

      - name: Scan Code for Exposed Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified --fail

      - name: Snyk Vulnerability Assessment
        uses: snyk/actions/node@master
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --org=reebow-tech

  # ─────────────────────────────────────────────────────────────────────
  # CONTAINER IMAGE BUILD & PUSH
  # ─────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, security]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Docker Buildx Environment
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Tags and Labels Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Reebow TECH Platform
            org.opencontainers.image.description=Secure real-time messaging and video call platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and Push Multi-Architecture Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

  # ─────────────────────────────────────────────────────────────────────
  # STAGING DEPLOYMENT
  # ─────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Deploy Update to Render (Staging)
        if: env.RENDER_API_KEY != ''
        uses: render/deploy-action@v1
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          wait-for-success: true
          timeout: 300

      - name: Deploy Update to Railway (Staging)
        if: env.RAILWAY_TOKEN != ''
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          project: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment: staging

      - name: Deploy Update to DigitalOcean (Staging)
        if: env.DO_TOKEN != ''
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
        env:
          DOCTL_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          doctl apps create-deployment ${{ secrets.DO_STAGING_APP_ID }} --wait

      - name: Verify Staging Health Status
        run: |
          sleep 30
          for i in {1..10}; do
            if curl -fsS "${{ secrets.STAGING_URL }}/health" | grep -q '"status":"ok"'; then
              echo "Staging environment is healthy."
              exit 0
            fi
            echo "Waiting for service response... ($i/10)"
            sleep 15
          done
          echo "Staging health check failed."
          exit 1

      - name: Run Staging Smoke Tests
        run: |
          curl -fsS "${{ secrets.STAGING_URL }}/api/version" | grep -q "2.0.0"
          curl -fsS "${{ secrets.STAGING_URL }}/manifest.json" | grep -q "Reebow Messenger"
          curl -fsS "${{ secrets.STAGING_URL }}/sw.js" | grep -q "SW_VERSION"
          echo "Staging smoke tests passed successfully."

  # ─────────────────────────────────────────────────────────────────────
  # PRODUCTION DEPLOYMENT
  # ─────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Deploy Release to Render (Production)
        if: env.RENDER_API_KEY != ''
        uses: render/deploy-action@v1
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          wait-for-success: true
          timeout: 600

      - name: Deploy Release to Railway (Production)
        if: env.RAILWAY_TOKEN != ''
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          project: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment: production

      - name: Deploy Release to DigitalOcean (Production)
        if: env.DO_TOKEN != ''
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
        env:
          DOCTL_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          doctl apps create-deployment ${{ secrets.DO_PROD_APP_ID }} --wait

      - name: Verify Production Health Status
        run: |
          sleep 45
          for i in {1..15}; do
            if curl -fsS "${{ secrets.PROD_URL }}/health" | grep -q '"status":"ok"'; then
              echo "Production environment is healthy."
              exit 0
            fi
            echo "Waiting for service response... ($i/15)"
            sleep 30
          done
          echo "Production health check failed - manual inspection required."
          exit 1

      - name: Create Official GitHub Release Entry
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Reebow TECH Platform ${{ github.ref_name }}
            
            ### Release Summary
            ${{ github.event.repository.description }}
            
            ### Deployment Information
            - **Container Image**: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - **Production URL**: ${{ secrets.PROD_URL }}
            - **Admin Panel**: ${{ secrets.PROD_URL }}/admin.html
            - **Visitor Portal**: ${{ secrets.PROD_URL }}/visitor.html
            
            ### Quick Verification Checklist
            - [ ] System health check responding normally
            - [ ] Admin authentication successful
            - [ ] Visitor registration operational
            - [ ] Live chat streaming active
            - [ ] Video clip injection functioning
            - [ ] Progressive Web App assets cached
            
            ### Rollback Plan
            If an issue occurs, execute: `git revert <commit>` and push a new tag to trigger an automated rollback release.
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Send Deployment Notification Alert
        if: env.NOTIFY_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.NOTIFY_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Reebow Platform ${{ github.ref_name }} successfully deployed to production!",
              "username": "Deploy Bot",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit Hash", "value": "${{ github.sha }}", "short": true},
                  {"title": "Triggered By", "value": "${{ github.actor }}", "short": true},
                  {"title": "Production URL", "value": "${{ secrets.PROD_URL }}", "short": false}
                ]
              }]
            }'

  # ─────────────────────────────────────────────────────────────────────
  # POST-DEPLOYMENT VERIFICATION
  # ─────────────────────────────────────────────────────────────────────
  post-deploy:
    name: Post-Deployment Verification Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Wait for Edge Network Propagation
        run: sleep 60

      - name: Verify Live Endpoints Return 200 OK
        run: |
          PROD_URL="${{ secrets.PROD_URL }}"
          endpoints=(
            "/health"
            "/api/version"
            "/manifest.json"
            "/sw.js"
            "/admin.html"
            "/visitor.html"
            "/style.css"
            "/mobile-fix.css"
            "/api/clips/manifest"
          )
          
          for ep in "${endpoints[@]}"; do
            if curl -fsS -o /dev/null -w "%{http_code}" "$PROD_URL$ep" | grep -q "^200$"; then
              echo "Endpoint verified: $ep"
            else
              echo "Endpoint verification failed: $ep"
              exit 1
            fi
          done
          
          if curl -fsS "$PROD_URL/manifest.json" | jq -e '.short_name == "Reebow"' >/dev/null; then
            echo "Web app manifest verified successfully."
          else
            echo "Web app manifest validation failed."
            exit 1
          fi

      - name: Run Live Integration Smoke Test
        run: |
          VISITOR_EMAIL="ci-test-${{ github.run_id }}@reebow.test"
          
          REGISTER=$(curl -fsS -X POST "${{ secrets.PROD_URL }}/api/visitor/register" \
            -H 'Content-Type: application/json' \
            -d "{\"email\": \"$VISITOR_EMAIL\", \"tenantId\": \"default\"}" \
            -c /tmp/ci-cookies.txt)
          
          if echo "$REGISTER" | jq -e '.success == true' >/dev/null; then
            echo "Visitor registration smoke test passed."
          else
            echo "Visitor registration smoke test failed."
            exit 1
          fi
          
          if curl -fsS "${{ secrets.PROD_URL }}/socket.io/socket.io.js" | grep -q "Socket"; then
            echo "Socket.io client bundle verified."
          else
            echo "Socket.io client bundle verification failed."
            exit 1
          fi

      - name: Output Final Deployment Status
        run: |
          echo "Production Deployment Verified Successfully!"
          echo "Version: ${{ github.ref_name }}"
          echo "Target URL: ${{ secrets.PROD_URL }}"
          echo "All post-deployment checks passed."
