# ════════════════════════════════════════════════════════════════════════
# REEBOW TECH PLATFORM — GITHUB ACTIONS CI/CD
# Multi-stage: Lint → Test → Build → Security → Deploy
# Version: 2.0.0
# ════════════════════════════════════════════════════════════════════════

name: Reebow Platform CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      skip_tests:
        description: 'Skip test suite'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ════════════════════════════════════════════════════════════════════════
# JOBS
# ════════════════════════════════════════════════════════════════════════

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # CODE QUALITY
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "**/*.{js,json,md,yml,yaml,html,css}"

  # ─────────────────────────────────────────────────────────────────────
  # UNIT & INTEGRATION TESTS
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    services:
      mongodb:
        image: mongo:7-jammy
        ports: ['27017:27017']
        options: --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate test clips manifest
        run: |
          mkdir -p public/clips/annie public/clips/craig
          # Create minimal test clips (1-sec silent MP4)
          ffmpeg -f lavfi -i color=c=black:s=1280x720 -t 1 -c:v libx264 -pix_fmt yuv420p public/clips/annie/hello.mp4 -y
          ffmpeg -f lavfi -i color=c=black:s=1280x720 -t 2 -c:v libx264 -pix_fmt yuv420p public/clips/annie/listening.mp4 -y
          cp public/clips/annie/hello.mp4 public/clips/annie/thinking.mp4
          cp public/clips/annie/hello.mp4 public/clips/annie/yes.mp4
          cp public/clips/annie/hello.mp4 public/clips/annie/no.mp4
          cp public/clips/annie/hello.mp4 public/clips/annie/goodbye.mp4
          cp -r public/clips/annie/* public/clips/craig/
          # Generate manifest
          node -e "
            const fs = require('fs'), path = require('path');
            const base = '/clips', personas = ['annie','craig'];
            const m = {};
            personas.forEach(p => { m[p] = {}; 
              fs.readdirSync('public'+base+'/'+p).filter(f=>f.endsWith('.mp4')).forEach(f => {
                m[p][f.replace('.mp4','')] = { url: path.join(base,p,f) };
              }); 
            });
            fs.writeFileSync('public/clips/manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Run unit tests
        run: npm test --if-present
        env:
          MONGO_URI: mongodb://localhost:27017/reebow-test
          NODE_ENV: test
          DEV_MOCK_GEO: 'true'
          DEV_DISABLE_RATE_LIMIT: 'true'
          SESSION_SECRET: test-secret-for-ci-only-do-not-use-in-production

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: unittests
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────
  # SECURITY SCANNING
  # ─────────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run npm audit
        run: npm audit --audit-level=high --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 7

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified --fail

      - name: Snyk security scan
        uses: snyk/actions/node@master
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --org=reebow-tech

  # ─────────────────────────────────────────────────────────────────────
  # DOCKER BUILD
  # ─────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, security]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Reebow TECH Platform
            org.opencontainers.image.description=Telegram-style real-time messaging & video call platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Sign image (cosign)
        if: env.COSIGN_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY STAGING
  # ─────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render (Staging)
        if: env.RENDER_API_KEY != ''
        uses: render/deploy-action@v1
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          wait-for-success: true
          timeout: 300

      - name: Deploy to Railway (Staging)
        if: env.RAILWAY_TOKEN != ''
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          project: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment: staging

      - name: Deploy to DigitalOcean (Staging)
        if: env.DO_TOKEN != ''
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
        env:
          DOCTL_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          doctl apps create-deployment ${{ secrets.DO_STAGING_APP_ID }} --wait

      - name: Health check staging
        run: |
          sleep 30
          for i in {1..10}; do
            if curl -fsS "${{ secrets.STAGING_URL }}/health" | grep -q '"status":"ok"'; then
              echo "✅ Staging healthy"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 15
          done
          echo "❌ Staging health check failed"
          exit 1

      - name: Run smoke tests
        run: |
          # Test critical endpoints
          curl -fsS "${{ secrets.STAGING_URL }}/api/version" | grep -q "2.0.0"
          curl -fsS "${{ secrets.STAGING_URL }}/manifest.json" | grep -q "Reebow Messenger"
          curl -fsS "${{ secrets.STAGING_URL }}/sw.js" | grep -q "SW_VERSION"
          echo "✅ Smoke tests passed"

  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY PRODUCTION
  # ─────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render (Production)
        if: env.RENDER_API_KEY != ''
        uses: render/deploy-action@v1
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          wait-for-success: true
          timeout: 600

      - name: Deploy to Railway (Production)
        if: env.RAILWAY_TOKEN != ''
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          project: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment: production

      - name: Deploy to DigitalOcean (Production)
        if: env.DO_TOKEN != ''
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
        env:
          DOCTL_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          doctl apps create-deployment ${{ secrets.DO_PROD_APP_ID }} --wait

      - name: Health check production
        run: |
          sleep 45
          for i in {1..15}; do
            if curl -fsS "${{ secrets.PROD_URL }}/health" | grep -q '"status":"ok"'; then
              echo "✅ Production healthy"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 30
          done
          echo "❌ Production health check failed - manual intervention required"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Reebow TECH Platform ${{ github.ref_name }}
            
            ### Changes
            ${{
              github.event.repository.description
            }}
            
            ### Deployment
            - **Docker Image**: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - **Production URL**: ${{ secrets.PROD_URL }}
            - **Admin Panel**: ${{ secrets.PROD_URL }}/admin.html
            - **Visitor Chat**: ${{ secrets.PROD_URL }}/visitor.html
            
            ### Verification
            - [ ] Health check passing
            - [ ] Admin login works
            - [ ] Visitor registration works
            - [ ] Real-time chat functional
            - [ ] Video clip injection works
            - [ ] PWA install prompts
            
            ### Rollback
            If issues: `git revert <commit>` → pushes new tag → auto-deploy
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Notify deployment
        if: env.NOTIFY_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.NOTIFY_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚀 Reebow Platform ${{ github.ref_name }} deployed to production!",
              "username": "Deploy Bot",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Deployed by", "value": "${{ github.actor }}", "short": true},
                  {"title": "Production URL", "value": "${{ secrets.PROD_URL }}", "short": false}
                ]
              }]
            }'

  # ─────────────────────────────────────────────────────────────────────
  # POST-DEPLOY VERIFICATION
  # ─────────────────────────────────────────────────────────────────────
  post-deploy:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Wait for CDN propagation
        run: sleep 60

      - name: Verify production endpoints
        run: |
          PROD_URL="${{ secrets.PROD_URL }}"
          
          # Core endpoints
          endpoints=(
            "/health"
            "/api/version"
            "/manifest.json"
            "/sw.js"
            "/admin.html"
            "/visitor.html"
            "/style.css"
            "/mobile-fix.css"
            "/api/clips/manifest"
          )
          
          for ep in "${endpoints[@]}"; do
            if curl -fsS -o /dev/null -w "%{http_code}" "$PROD_URL$ep" | grep -q "^200$"; then
              echo "✅ $ep"
            else
              echo "❌ $ep failed"
              exit 1
            fi
          done
          
          # Verify PWA
          if curl -fsS "$PROD_URL/manifest.json" | jq -e '.short_name == "Reebow"' >/dev/null; then
            echo "✅ Manifest valid"
          else
            echo "❌ Manifest invalid"
            exit 1
          fi

      - name: Run integration smoke test
        run: |
          # Simulate visitor registration
          VISITOR_EMAIL="ci-test-${{ github.run_id }}@reebow.test"
          
          REGISTER=$(curl -fsS -X POST "${{ secrets.PROD_URL }}/api/visitor/register" \
            -H 'Content-Type: application/json' \
            -d "{\"email\": \"$VISITOR_EMAIL\", \"tenantId\": \"default\"}" \
            -c /tmp/ci-cookies.txt)
          
          if echo "$REGISTER" | jq -e '.success == true' >/dev/null; then
            echo "✅ Visitor registration works"
          else
            echo "❌ Visitor registration failed"
            exit 1
          fi
          
          # Check Socket.io endpoint
          if curl -fsS "${{ secrets.PROD_URL }}/socket.io/socket.io.js" | grep -q "Socket"; then
            echo "✅ Socket.io client served"
          else
            echo "❌ Socket.io client failed"
            exit 1
          fi

      - name: Report status
        run: |
          echo "## ✅ Production Deployment Verified"
          echo ""
          echo "**Version:** ${{ github.ref_name }}"
          echo "**Commit:** ${{ github.sha }}"
          echo "**URL:** ${{ secrets.PROD_URL }}"
          echo "**Time:** $(date -u)"
          echo ""
          echo "All verification checks passed! 🎉"

# ════════════════════════════════════════════════════════════════════════
# WORKFLOW END
# ════════════════════════════════════════════════════════════════════════
